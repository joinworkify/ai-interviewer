name: AI interviewer CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject edits to migrations already on the base branch
        if: github.event_name == 'pull_request'
        run: |
          violations=$(git diff --name-status "${{ github.event.pull_request.base.sha }}...HEAD" -- 'supabase/migrations/*.sql' | awk '$1 != "A" {print}')
          if [ -n "$violations" ]; then
            echo "::error::Do not edit, delete or rename migrations already on the base branch. Add a new migration instead."
            echo "$violations"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and test
        run: npm run verify

  db:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Supabase env file
        run: cp supabase/.env.example supabase/.env

      - name: Start local Supabase
        run: npx supabase start

      - name: Apply every migration and the seed from scratch
        run: npx supabase db reset --yes

      - name: Check database connectivity
        run: npx supabase db query "select 1"

      - name: Lint SQL functions
        run: npx supabase db lint --level error --fail-on error

      - name: Database, RLS and deletion tests
        run: npx vitest run tests/db

      - name: Real-database transcript store test
        run: |
          supabase_status="$(npx supabase status -o json | sed -n '/^{/,$p')"
          SUPABASE_TEST_URL="$(printf '%s' "$supabase_status" | jq -r .API_URL)"
          SUPABASE_TEST_SECRET_KEY="$(printf '%s' "$supabase_status" | jq -r .SERVICE_ROLE_KEY)"
          export SUPABASE_TEST_URL SUPABASE_TEST_SECRET_KEY
          test -n "$SUPABASE_TEST_URL" && test -n "$SUPABASE_TEST_SECRET_KEY"
          npx vitest run tests/transcripts-store.integration.test.ts

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
